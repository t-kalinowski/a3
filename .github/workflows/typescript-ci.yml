name: TypeScript CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - typescript/**
      - spec/conformance/**
  push:
    branches:
      - main
    paths:
      - typescript/**
      - spec/conformance/**

permissions:
  contents: read

concurrency:
  group: typescript-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: typescript/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # JSR enforces rules `tsc` does not — chiefly "no slow types", which
      # requires an explicit type on every exported symbol. Without this step
      # those failures surface only on the publish job, after merge, when the
      # release is already half-done.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check JSR publishability
        run: deno publish --dry-run
