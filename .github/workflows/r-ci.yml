name: R CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - r/**
      - spec/conformance/**
  push:
    branches:
      - main
    paths:
      - r/**
      - spec/conformance/**

permissions:
  contents: read

concurrency:
  group: r-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://rtemis-org.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: 1

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

      # A plain check does not catch a package used unconditionally from
      # Suggests. This does, and it is the check that would have caught
      # jsonlite being in Suggests with 13 unguarded call sites.
      - name: Check with dependencies only
        working-directory: r
        env:
          _R_CHECK_DEPENDS_ONLY_: true
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          R CMD build .
          R CMD check rtemis.a3_*.tar.gz --no-manual
