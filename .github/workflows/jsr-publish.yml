name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # No `deno install` step and no deno.lock: the published sources import
      # nothing but relative paths and `node:fs/promises`, and jsr.json declares
      # no imports. The lockfile only ever pinned npm *devDependencies*, which
      # `deno publish` does not use — so it went stale on every pnpm update and
      # broke publishing after merge, which is exactly what it did on #17.
      # pnpm-lock.yaml pins the devDependencies for the tool that installs them.
      - name: Publish package
        run: deno publish
